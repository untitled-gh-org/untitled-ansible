---
# Install aptitude so Ansible can manage packages more reliably
- name: Install aptitude
  ansible.builtin.apt:
    name: aptitude
    state: latest
    update_cache: true

# Install packages required before Docker can be added
- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - python3-pip
      - virtualenv
      - python3-setuptools
    state: latest
    update_cache: true

# Add Docker's official GPG key to verify package integrity
- name: Add Docker GPG apt Key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Register the official Docker APT repository as a package source
- name: Add Docker Repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present

# Install the Docker CE package from the Docker repository
- name: Update apt and install docker-ce
  ansible.builtin.apt:
    name: docker-ce
    state: latest
    update_cache: true

# Install Docker Compose v2 as an APT plugin (replaces standalone binary)
- name: Install Docker Compose plugin
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: latest
    update_cache: true

- import_tasks: network.yml
- import_tasks: proxy.yml
