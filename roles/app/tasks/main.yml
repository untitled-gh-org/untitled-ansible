---
- name: Include vars of vault.yml into vault variable
  ansible.builtin.include_vars:
    file: vault.yml
    name: vault

- name: Create public network
  community.docker.docker_network:
    name: public
    driver: bridge

- name: Create private network
  community.docker.docker_network:
    name: private
    driver: bridge
    force: true

- name: Start nginx-proxy container
  community.docker.docker_container:
    name: nginx-proxy
    image: nginxproxy/nginx-proxy:1.10
    restart_policy: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - name: public
      - name: private
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

- name: Start acme-companion container
  community.docker.docker_container:
    name: acme-companion
    image: nginxproxy/acme-companion:2.6
    restart_policy: unless-stopped
    networks:
      - name: public
      - name: private
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    volumes_from:
      - nginx-proxy

- name: Start postgres container
  community.docker.docker_container:
    name: db
    image: postgres:18.3
    state: healthy
    restart_policy: unless-stopped
    networks:
      - name: private
    exposed_ports:
      - 5432
    env:
      POSTGRES_USER: "keycloak"
      POSTGRES_PASSWORD: "{{ vault.db_password }}"
      POSTGRES_DB: "keycloak"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 3

- name: Create keycloak docker context dir
  ansible.builtin.file:
    path: "{{ keycloak_build_context }}"
    state: directory

- name: Copy keycloak/Dockerfile
  ansible.builtin.copy:
    src: keycloak/Dockerfile
    dest: "{{ keycloak_build_context }}/Dockerfile"

- name: Build keycloak image
  community.docker.docker_image_build:
    name: "{{ keycloak_image }}"
    path: "{{ keycloak_build_context }}"

- name: Start keycloak container
  community.docker.docker_container:
    name: keycloak
    image: "{{ keycloak_image }}"
    command: start --optimized
    state: healthy
    restart_policy: unless-stopped
    networks:
      - name: private
    exposed_ports:
      - 8080
    env:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ vault.keycloak_admin_password }}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "https://auth.{{ domain_name }}"
      KC_PROXY_HEADERS: "xforwarded"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://db:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "{{ vault.db_password }}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      VIRTUAL_HOST: "auth.{{ domain_name }}"
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: "auth.{{ domain_name }}"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep 200 <&3\"" ]
      interval: 10s
      timeout: 5s
      retries: 3

- name: Start bff container
  community.docker.docker_container:
    name: bff
    image: "{{ bff_image }}"
    state: healthy
    restart_policy: unless-stopped
    networks:
      - name: private
    exposed_ports:
      - 8081
    env:
      BFF_HOME_URL: "https://{{ domain_name }}"
      BFF_CLIENT_URL: "https://bff.{{ domain_name }}"
      UNTITLED_API_URI: "http://api:8082"
      BFF_SESSION_COOKIE_DOMAIN: "{{ domain_name }}"
      BFF_SESSION_COOKIE_SECURE: "true"
      KEYCLOAK_ISSUER_URI: "{{ keycloak_issuer_uri }}"
      KEYCLOAK_CLIENT_ID: "{{ vault.keycloak_client_id }}"
      KEYCLOAK_CLIENT_SECRET: "{{ vault.keycloak_client_secret }}"
      VIRTUAL_HOST: "bff.{{ domain_name }}"
      VIRTUAL_PORT: "8081"
      LETSENCRYPT_HOST: "bff.{{ domain_name }}"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

- name: Start api container
  community.docker.docker_container:
    name: api
    image: "{{ api_image }}"
    state: healthy
    restart_policy: unless-stopped
    networks:
      - name: private
    exposed_ports:
      - 8082
    env:
      KEYCLOAK_ISSUER_URI: "{{ keycloak_issuer_uri }}"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8082/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

- name: Start web container
  community.docker.docker_container:
    name: web
    image: "{{ web_image }}"
    restart_policy: unless-stopped
    networks:
      - name: private
    exposed_ports:
      - 80
    env:
      VIRTUAL_HOST: "{{ domain_name }}"
      LETSENCRYPT_HOST: "{{ domain_name }}"
